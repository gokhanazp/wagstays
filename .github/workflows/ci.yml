name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dummy values: nothing here talks to a real database or Supabase project.
      # `prisma generate` only needs the variables to exist, and `next build` must not query the DB.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: https://wagstays.vercel.app
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Route types (PageProps / LayoutProps globals, next-env.d.ts) are generated, not committed.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx next build

  e2e-gate:
    name: Check E2E configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: echo "enabled=$([ -n "$E2E_BASE_URL" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  e2e-smoke:
    name: E2E smoke (anonymous)
    needs: [e2e-gate]
    # Optional: runs only when the repository secret E2E_BASE_URL is set (Settings → Secrets → Actions).
    if: needs.e2e-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/smoke.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
